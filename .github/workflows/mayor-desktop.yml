# Builds Mayor for Mac and Windows with Tauri. Not run yet: the repo has no remote.
name: Mayor desktop

on:
  workflow_dispatch:
  push:
    tags: ["mayor-v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cities-skylines-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cities-skylines-2/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: cities-skylines-2/src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: mayor-${{ matrix.os }}
          path: |
            cities-skylines-2/src-tauri/target/release/bundle/dmg/*.dmg
            cities-skylines-2/src-tauri/target/release/bundle/msi/*.msi
            cities-skylines-2/src-tauri/target/release/bundle/nsis/*.exe
